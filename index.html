<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Reading</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Key terms, topic overviews, sources and exam technique for Edexcel A Level Politics.">
<script>
  /* Apply the saved theme before first paint. White is the default. */
  (function () { var t = 'light'; try { t = localStorage.getItem('prh:theme') || 'light'; } catch (e) {} document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one clean reading column, hairline rules, black-on-white type. Colour appears only as small paper markers (green, red, blue). */
:root {
  --bg: #ffffff; --surface: #ffffff; --subtle: #f5f5f4; --hover: #f0f0ef;
  --ink: #0c0c0d; --ink-2: #3a3a3e; --muted: #6e6e73; --line: #e6e6e8; --line-2: #d4d4d8;
  --accent: #0c0c0d; --on-accent: #ffffff;
  --p1: #2b8a62; --p1-soft: #dcf3e7; --p2: #c4506a; --p2-soft: #fbe1e6; --p3: #4569cf; --p3-soft: #dfe7fb;
  --lav: #7457c7; --lav-soft: #ebe4fb; --peach: #c66a2e; --peach-soft: #fde6d6; --butter-soft: #fbf0c6;
  --good: #2b8a62; --bad: #c4506a; --mark: #fbf0c6; --glow: rgba(160, 130, 240, .16);
  --chart-a: #cfdaf8; --chart-b: #9b86e6;
  --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #09090a; --surface: #111113; --subtle: #161619; --hover: #1c1c20;
  --ink: #f3f3f4; --ink-2: #c9c9ce; --muted: #8e8e96; --line: #232327; --line-2: #34343a;
  --accent: #f3f3f4; --on-accent: #09090a;
  --p1: #a3e6c6; --p1-soft: #142a20; --p2: #f7b1bf; --p2-soft: #2e171d; --p3: #adc4fb; --p3-soft: #161f36;
  --lav: #cdbdf7; --lav-soft: #211b35; --peach: #f9c59f; --peach-soft: #2e1e12; --butter-soft: #2e2a14;
  --good: #a3e6c6; --bad: #f7b1bf; --mark: #3b3416; --glow: rgba(190, 170, 255, .10); --chart-a: #2c3553; --chart-b: #b9a7f5; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #09090a; --surface: #111113; --subtle: #161619; --hover: #1c1c20;
  --ink: #f3f3f4; --ink-2: #c9c9ce; --muted: #8e8e96; --line: #232327; --line-2: #34343a;
  --accent: #f3f3f4; --on-accent: #09090a;
  --p1: #a3e6c6; --p1-soft: #142a20; --p2: #f7b1bf; --p2-soft: #2e171d; --p3: #adc4fb; --p3-soft: #161f36;
  --lav: #cdbdf7; --lav-soft: #211b35; --peach: #f9c59f; --peach-soft: #2e1e12; --butter-soft: #2e2a14;
  --good: #a3e6c6; --bad: #f7b1bf; --mark: #3b3416; --glow: rgba(190, 170, 255, .10); --chart-a: #2c3553; --chart-b: #b9a7f5; color-scheme: dark }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); margin: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
::selection { background: var(--ink); color: var(--bg); }
a { color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
h1 { font-size: clamp(2.1rem, 5vw, 3.4rem); letter-spacing: -0.035em; line-height: 1.04; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.08rem; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* ---------- Header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 28px; height: 60px; }
.brand { font-weight: 600; letter-spacing: -0.02em; text-decoration: none; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.mark-sq { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); display: grid; place-items: center; }
.mark-sq i { display: flex; gap: 2px; } .mark-sq b { width: 3px; height: 10px; border-radius: 1px; display: block; }
.mark-sq b:nth-child(1) { background: var(--p1); } .mark-sq b:nth-child(2) { background: var(--p2); } .mark-sq b:nth-child(3) { background: var(--p3); }
nav.main { display: flex; gap: 2px; position: relative; }
nav.main a { text-decoration: none; color: var(--muted); padding: 6px 11px; border-radius: 8px; font-size: .92rem; font-weight: 500; transition: color .2s var(--ease); position: relative; z-index: 1; white-space: nowrap; }
nav.main a:hover, nav.main a.on { color: var(--ink); }
.nav-pill { position: absolute; top: 0; height: 100%; border-radius: 8px; background: var(--hover); transition: transform .35s var(--ease), width .35s var(--ease), opacity .2s; z-index: 0; opacity: 0; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { position: relative; width: 240px; }
.search input { width: 100%; height: 36px; padding: 0 44px 0 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--subtle); transition: border-color .2s, background .2s, box-shadow .2s; }
.search input:focus { outline: none; border-color: var(--line-2); background: var(--surface); box-shadow: 0 0 0 4px var(--hover); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 500 .7rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; background: var(--surface); }
.icon-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background .2s, border-color .2s, transform .15s; }
.icon-btn:hover { background: var(--hover); border-color: var(--line-2); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 17px; height: 17px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; transition: transform .5s var(--ease); }
:root[data-theme="dark"] .icon-btn svg { transform: rotate(-90deg); }
.sun, .moon { transition: opacity .3s, transform .5s var(--ease); transform-origin: center; }
.moon { opacity: 0; transform: scale(.5); }
:root[data-theme="dark"] .sun { opacity: 0; transform: scale(.5); }
:root[data-theme="dark"] .moon { opacity: 1; transform: scale(1); }
@media (max-width: 860px) {
  .top { position: static; }
  .top .wrap { flex-wrap: wrap; height: auto; padding-block: 12px; gap: 10px 12px; }
  nav.main { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
  nav.main::-webkit-scrollbar { display: none; }
  .search { width: auto; flex: 1; } .kbd { display: none; }
  .tools { flex: 1; }
}

main { padding-block: 56px 96px; min-height: 70vh; }
.eyebrow { font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.lede { color: var(--muted); font-size: 1.1rem; line-height: 1.55; max-width: 60ch; margin: 16px 0 0; }
section + section { margin-top: 72px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.sec-h a, .link { font-size: .9rem; color: var(--muted); text-decoration: none; transition: color .2s; }
.sec-h a:hover, .link:hover { color: var(--ink); }
.sec-h a::after, .link::after { content: " →"; display: inline-block; transition: transform .25s var(--ease); }
.sec-h a:hover::after, .link:hover::after { transform: translateX(3px); }

/* Paper tags */
.tag { display: inline-flex; align-items: center; gap: 6px; font: 500 .72rem/1 var(--mono); letter-spacing: .02em; padding: 5px 8px 5px 7px; border-radius: 6px; text-decoration: none; white-space: nowrap; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); transition: border-color .2s, background .2s; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
a.tag:hover { border-color: var(--line-2); background: var(--hover); }
.tag.p1::before { background: var(--p1); } .tag.p2::before { background: var(--p2); } .tag.p3::before { background: var(--p3); }
.tag.plain::before { display: none; }
.tag.real { border-color: transparent; background: var(--p2-soft); color: var(--p2); }
.tag.real::before { background: var(--p2); }

/* ---------- Home ---------- */
.hero { padding-block: 8px 12px; max-width: 820px; }
.hero h1 { margin-top: 18px; }
.hero h1 .soft { color: var(--muted); }
.hero-search { margin-top: 32px; max-width: 560px; position: relative; }
.hero-search input { width: 100%; height: 54px; padding: 0 16px 0 48px; font-size: 1.05rem; border: 1px solid var(--line-2); border-radius: 14px; background: var(--surface); transition: box-shadow .25s var(--ease), border-color .2s; }
.hero-search input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 5px var(--hover); }
.hero-search svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.counts { display: flex; gap: 32px; margin-top: 28px; flex-wrap: wrap; }
.counts div { display: flex; flex-direction: column; }
.counts b { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.counts span { color: var(--muted); font-size: .85rem; }
.papers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
@media (max-width: 900px) { .papers { grid-template-columns: 1fr; } }
.paper { padding: 26px 26px 18px 0; display: flex; flex-direction: column; min-width: 0; }
.paper + .paper { padding-left: 26px; border-left: 1px solid var(--line); }
@media (max-width: 900px) { .paper, .paper + .paper { padding: 24px 0; border-left: 0; border-bottom: 1px solid var(--line); } }
.paper h2 { font-size: 1.25rem; margin: 14px 0 12px; }
.paper .sub { font: 500 .7rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.tlink { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; text-decoration: none; border-bottom: 1px solid var(--line); transition: padding .25s var(--ease); }
.tlink:last-child { border-bottom: 0; }
.tlink b { font-weight: 500; display: block; }
.tlink span { color: var(--muted); font: .74rem var(--mono); display: block; margin-top: 2px; }
.tlink .arr { color: var(--muted); transition: transform .25s var(--ease), color .2s; flex: none; }
.tlink:hover { padding-left: 6px; }
.tlink:hover .arr { transform: translateX(4px); color: var(--ink); }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .quick { grid-template-columns: 1fr; } }
.quick a { display: flex; flex-direction: column; gap: 6px; padding: 20px; border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; background: var(--surface); transition: transform .3s var(--ease), border-color .2s, box-shadow .3s var(--ease); min-width: 0; }
.quick a:hover { transform: translateY(-3px); border-color: var(--line-2); box-shadow: 0 12px 30px -18px rgba(0,0,0,.35); }
.quick b { font-weight: 600; font-size: 1.02rem; letter-spacing: -0.01em; }
.quick span { color: var(--muted); font-size: .9rem; line-height: 1.45; }
.quick .go { margin-top: auto; padding-top: 10px; font-size: .85rem; color: var(--ink); }
.quick .go::after { content: " →"; display: inline-block; transition: transform .25s var(--ease); }
.quick a:hover .go::after { transform: translateX(4px); }

/* ---------- Topic page ---------- */
.topic-head { max-width: 820px; }
.topic-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 56px; align-items: start; margin-top: 48px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); display: flex; flex-direction: column; font-size: .88rem; border-left: 1px solid var(--line); }
.toc a { color: var(--muted); text-decoration: none; padding: 5px 0 5px 14px; margin-left: -1px; border-left: 1px solid transparent; transition: color .2s, border-color .25s var(--ease); }
.toc a:hover { color: var(--ink); }
.toc a.on { color: var(--ink); border-left-color: var(--ink); }
.toc .toc-h { font: 500 .68rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px 14px; }
.toc .toc-h:first-child { margin-top: 0; }
@media (max-width: 900px) { .topic-layout { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
.crumbs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .88rem; color: var(--muted); margin-bottom: 18px; }
.crumbs a { text-decoration: none; } .crumbs a:hover { color: var(--ink); }
.ov { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 40px; }
@media (max-width: 760px) { .ov { grid-template-columns: 1fr; } }
.ov h3 { margin-bottom: 12px; }
.ov ul, .deb ul, .box ul, .box ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.ov li, .deb li, .box li { position: relative; padding-left: 16px; color: var(--ink-2); max-width: 70ch; }
.ov li::before, .deb li::before, .box ul li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 1px; background: var(--muted); }
.box ol { counter-reset: n; } .box ol li { counter-increment: n; padding-left: 24px; }
.box ol li::before { content: counter(n); position: absolute; left: 0; top: .15em; font: 500 .72rem var(--mono); color: var(--muted); }
.ov b, .box b { font-weight: 600; color: var(--ink); }
.deb { display: flex; flex-direction: column; gap: 28px; }
.deb-q { font-weight: 600; font-size: 1.12rem; letter-spacing: -0.015em; margin-bottom: 14px; }
.deb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
@media (max-width: 640px) { .deb-cols { grid-template-columns: 1fr; } }
.deb-col { padding: 18px 20px; min-width: 0; }
.deb-col + .deb-col { border-left: 1px solid var(--line); }
@media (max-width: 640px) { .deb-col + .deb-col { border-left: 0; border-top: 1px solid var(--line); } }
.deb-col h4 { margin: 0 0 12px; font: 500 .7rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.deb-col h4::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.deb-col.yes h4::before { background: var(--p1); } .deb-col.no h4::before { background: var(--p2); }
.deb-col li { font-size: .95rem; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 80px; }
.pager a { text-decoration: none; font-weight: 600; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); transition: border-color .2s, transform .3s var(--ease); }
.pager a:hover { border-color: var(--line-2); transform: translateY(-2px); }
.pager small { display: block; color: var(--muted); font: 400 .78rem var(--mono); margin-bottom: 4px; }

/* ---------- Diagrams ---------- */
.dg { border: 1px solid var(--line); border-radius: var(--r); padding: 22px; min-width: 0; background: var(--surface); }
.dg + .dg { margin-top: 18px; }
.dg h3 { font-size: .98rem; margin-bottom: 16px; }
.dg-note { color: var(--muted); font-size: .86rem; margin: 12px 0 0; }
.tbl-wrap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
.tbl { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 520px; }
.tbl th, .tbl td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl thead th { font: 500 .7rem/1.3 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tbl tbody th { font-weight: 600; white-space: nowrap; }
.tbl tbody td { color: var(--ink-2); }
.tbl tbody tr { transition: background .15s; }
.tbl tbody tr:hover { background: var(--subtle); }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 340px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 10.5px var(--mono); }
.chart .lbl { fill: var(--ink); font: 500 12px var(--sans); }
.chart .val { fill: var(--muted); font: 10.5px var(--mono); }
.chart .bar { transform-box: fill-box; transform-origin: left center; }
.chart .bar.s0 { fill: var(--chart-a); } .chart .bar.s1 { fill: var(--chart-b); }
.chart .ln { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.chart .area { fill: var(--subtle); }
.chart .pt { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.chart .pt.hl { fill: var(--ink); }
.legend { display: flex; gap: 18px; font-size: .84rem; color: var(--muted); margin-top: 10px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.legend .sw.s0 { background: var(--chart-a); } .legend .sw.s1 { background: var(--chart-b); }
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.flow-step { flex: 1 1 128px; background: var(--subtle); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: background .2s, transform .3s var(--ease); }
.flow-step:hover { background: var(--hover); transform: translateY(-2px); }
.flow-step b { font-size: .9rem; font-weight: 600; } .flow-step span { font-size: .8rem; color: var(--muted); line-height: 1.4; }
.flow-n { font: 500 .7rem/1 var(--mono) !important; color: var(--muted) !important; }
.flow-arrow { align-self: center; color: var(--line-2); }
.flow.cycle .flow-step:last-child::after { content: "↺ repeats"; font: 500 .7rem var(--mono); color: var(--p2); margin-top: 4px; }
.tl { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 0; }
.tl::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--line-2); }
.tl li { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 7px 0 7px 22px; position: relative; font-size: .93rem; color: var(--ink-2); }
.tl li::before { content: ""; position: absolute; left: 0; top: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--ink); transition: background .2s; }
.tl li:hover::before { background: var(--ink); }
.tl-y { font: 500 .85rem var(--mono); color: var(--ink); }
.branches { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .branches { grid-template-columns: 1fr; } }
.branch { padding: 16px; border-radius: 10px; display: flex; flex-direction: column; gap: 5px; background: var(--subtle); border: 1px solid transparent; }
.branch span { font-size: .85rem; color: var(--muted); }
.branch.fused { border-color: var(--p1); background: var(--p1-soft); }
.branch.sep { border-color: var(--p3); background: var(--p3-soft); }
.spectrum .spec-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--p1), var(--p3), var(--p2)); }
.spec-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; font-size: .85rem; font-weight: 600; }
.spec-labels span:nth-child(n+3) { text-align: right; } .spec-labels small { font-weight: 400; color: var(--muted); }
.org-top { text-align: center; font-weight: 600; padding: 12px; border: 1px solid var(--ink); border-radius: 10px; max-width: 360px; margin: 0 auto 14px; }

/* ---------- Filters, terms ---------- */
.filters { display: flex; flex-direction: column; gap: 12px; margin: 36px 0 24px; }

.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--subtle); width: 100%; max-width: 440px; transition: border-color .2s, background .2s, box-shadow .2s; }

.term-list { display: flex; flex-direction: column; margin: 0; }

@media (max-width: 640px) { .term { grid-template-columns: 1fr; } }
.term.hidden-def .def { filter: blur(7px); opacity: .7; cursor: pointer; user-select: none; transition: filter .35s var(--ease), opacity .35s; border-radius: 4px; }
.term.hidden-def .def:hover { filter: blur(5px); }
.term.hidden-def .def.shown { filter: none; opacity: 1; cursor: text; user-select: text; }
.letter { font-weight: 600; font-size: 1.5rem; letter-spacing: -0.03em; padding: 36px 0 10px; border-bottom: 1px solid var(--ink); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); background: var(--bg); z-index: 2; }
@media (max-width: 860px) { .letter { top: env(safe-area-inset-top, 0px); } }

/* ---------- Examples ---------- */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

.ex p { margin: 0; font-size: .93rem; color: var(--ink-2); }
.ex .use { font-size: .86rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
.ex .use b { color: var(--ink); font-weight: 500; }

/* ---------- Exam ---------- */
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.box { border: 1px solid var(--line); border-radius: var(--r); padding: 22px; min-width: 0; background: var(--surface); }
.box h3 { margin-bottom: 12px; }
.box .meta { color: var(--muted); font-size: .88rem; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--subtle); border-radius: 11px; margin-bottom: 22px; overflow-x: auto; position: relative; width: fit-content; max-width: 100%; }
.tabs button { background: none; border: 0; padding: 8px 14px; cursor: pointer; color: var(--muted); border-radius: 8px; white-space: nowrap; font-weight: 500; font-size: .9rem; position: relative; z-index: 1; transition: color .2s; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tab-pill { position: absolute; top: 4px; bottom: 4px; border-radius: 8px; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 1px var(--line); transition: transform .35s var(--ease), width .35s var(--ease); z-index: 0; }
.wording { font-size: 1.02rem; color: var(--ink-2); border-left: 2px solid var(--ink); padding: 4px 0 4px 18px; margin: 14px 0 22px; max-width: 75ch; }

@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.para { display: flex; flex-direction: column; }
.para-row { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: .94rem; }
.para-row:last-child { border-bottom: 0; }
.k { font: 500 .72rem/1.8 var(--mono); text-transform: uppercase; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 7px; }
.k::before { content: ""; width: 7px; height: 7px; border-radius: 2px; flex: none; }
.k.c0::before, .k.c1::before { background: var(--p1); } .k.c2::before { background: var(--p3); } .k.c3::before, .k.c4::before { background: var(--p2); } .k.c5::before { background: var(--ink); }
.model .seg { border-radius: 3px; padding: 1px 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; line-height: 1.75; color: var(--ink); }
.seg.c0, .seg.c1 { background: var(--p1-soft); } .seg.c2 { background: var(--p3-soft); } .seg.c3, .seg.c4 { background: var(--p2-soft); } .seg.c5 { background: var(--hover); font-weight: 600; }
.ao { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 760px) { .ao { grid-template-columns: 1fr; } }
.ao b.big { font-size: 2rem; font-weight: 600; letter-spacing: -0.04em; display: block; margin-bottom: 8px; }
.qlist { display: flex; flex-direction: column; }
.qitem { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; gap: 14px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
.qitem .q { font-weight: 500; flex: 1 1 380px; }
.qitem .qmeta { display: flex; gap: 6px; flex-wrap: wrap; }
.qtip { color: var(--muted); font-size: .92rem; margin-top: 4px; }

/* ---------- Quiz ---------- */
.quiz-card { border: 1px solid var(--line); border-radius: 18px; padding: 32px; max-width: 720px; background: var(--surface); box-shadow: 0 24px 60px -40px rgba(0,0,0,.4); }

.progress i { display: block; height: 100%; background: var(--ink); border-radius: 2px; transition: width .5s var(--ease); }
.prompt { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.35; margin-bottom: 24px; }
.prompt small { display: flex; align-items: center; gap: 8px; font: 500 .7rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; line-height: 1.45; display: flex; gap: 14px; align-items: flex-start; transition: border-color .2s, background .2s, transform .15s; color: var(--ink-2); }
.opt .ok { font: 500 .72rem/1.9 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; min-width: 24px; text-align: center; flex: none; transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease; }
.opt:hover:not([disabled]) { border-color: var(--ink); color: var(--ink); }
.opt:active:not([disabled]) { transform: scale(.99); }
.opt.right { border-color: var(--good); background: var(--p1-soft); color: var(--ink); }
.opt.right .ok { background: var(--good); border-color: var(--good); color: var(--bg); }
.opt.wrong { border-color: var(--bad); background: var(--p2-soft); color: var(--ink); animation: shake .4s var(--ease); }
.opt.wrong .ok { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt[disabled] { cursor: default; }
.opt[disabled]:not(.right):not(.wrong) { opacity: .5; }
.answer { background: var(--subtle); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; animation: rise .4s var(--ease) both; }
.answer b { display: block; font-size: 1.12rem; font-weight: 600; }
.answer span { color: var(--muted); font-size: .92rem; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); height: 42px; padding: 0 18px; border-radius: 10px; cursor: pointer; font-weight: 500; transition: transform .15s, opacity .2s, background .2s; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { opacity: .88; } .btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--hover); opacity: 1; }
.btn.good { background: var(--good); border-color: var(--good); color: var(--bg); }
.btn.bad { background: transparent; border-color: var(--bad); color: var(--bad); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.feedback { margin-top: 16px; font-size: .95rem; animation: rise .35s var(--ease) both; }
.setup { display: grid; gap: 32px; max-width: 820px; margin-top: 40px; }
.setup h3 { font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .modes { grid-template-columns: 1fr 1fr; } }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 16px; border-radius: 12px; cursor: pointer; transition: border-color .2s, transform .2s var(--ease), box-shadow .2s; display: flex; flex-direction: column; gap: 4px; }
.mode:hover { border-color: var(--line-2); transform: translateY(-2px); }
.mode b { font-weight: 600; } .mode span { font-size: .84rem; color: var(--muted); line-height: 1.4; }
.mode[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.score { font-size: 4rem; font-weight: 600; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; line-height: 1; margin: 10px 0 6px; }
.missed { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.missed div { padding: 12px 14px; border-left: 2px solid var(--bad); background: var(--subtle); border-radius: 0 10px 10px 0; font-size: .92rem; color: var(--ink-2); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .84rem; }
footer .wrap { padding-block: 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* ---------- Motion ----------
   Curves: --ease (strong ease-out) for entrances, --ease-in-out for things moving on screen.
   UI responses stay at 160-250ms; section reveals are tied to scroll position, not a clock. */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes draw { from { stroke-dashoffset: var(--len, 1200); } to { stroke-dashoffset: 0; } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
@keyframes reveal { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

/* Page entrance, cast by role: the heading leads, the lede supports, everything else is already there.
   Home is the one first-visit moment and gets a slightly longer wave. */
@keyframes lead { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes support { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.enter h1 { animation: lead 340ms var(--ease) both; }
.enter h1 + .lede, .enter .topic-head .lede { animation: support 300ms var(--ease) 60ms both; }
.enter .hero h1 { animation-duration: 520ms; }
.enter .hero .lede { animation: support 480ms var(--ease) 90ms both; }
.enter .hero-search { animation: support 440ms var(--ease) 150ms both; }
.enter .hero .counts { animation: fade 400ms ease 220ms both; }
.enter .crumbs { animation: fade 300ms ease both; }
.q-in { animation: slideIn 220ms var(--ease) both; }
.answer, .feedback { animation: rise 200ms var(--ease) both; }
.opt.wrong { animation: shake 300ms var(--ease-in-out); }
.list-in > * { animation: fade 200ms ease both; }
.tabpanel.swap { animation: rise 200ms var(--ease) both; }
.enter .hl-sweep { animation: sweep 700ms var(--ease) 300ms both; }

/* Scroll-linked reveals (browsers without support simply show everything) */
/* Scroll-linked reveals: one entrance per container, sized by role.
   Home and exam sections rise as a whole; topic sections stay still so reading isn't disturbed,
   and only their debate blocks and diagram contents (the data) move. */
@keyframes rise-lg { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes rise-sm { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@supports (animation-timeline: view()) {
  main > section, .pager { animation: rise-lg auto var(--ease) both; animation-timeline: view(); animation-range: entry 0% entry 200px; }
  .deb > div { animation: rise-sm auto var(--ease) both; animation-timeline: view(); animation-range: entry 0% entry 140px; }
  .dg { view-timeline: --chart block; }
  .chart .bar { animation: grow auto var(--ease) both; animation-timeline: --chart; animation-range: entry 30% cover 45%; }
  .chart .bar.s0 { animation-range: entry 25% cover 40%; }
  .chart .ln { stroke-dasharray: var(--len, 1200); animation: draw auto var(--ease-in-out) both; animation-timeline: --chart; animation-range: entry 30% cover 50%; }
  .chart .area, .chart .pt, .chart .val { animation: fade auto linear both; animation-timeline: --chart; animation-range: cover 38% cover 50%; }
  .tl li { animation: fade auto linear both; animation-timeline: view(); animation-range: entry 20% entry 100%; }
  .steps li { animation: rise-sm auto var(--ease) both; animation-timeline: view(); animation-range: entry 10% entry 100%; }
}

/* Press feedback: one consistent, quick press on everything you click */
.btn, .chip, .mode, .opt, .icon-btn, .tabs button { transition-property: transform, background-color, border-color, color, box-shadow, opacity; transition-duration: 160ms; transition-timing-function: var(--ease); }
.btn:active, .chip:active, .mode:active, .opt:active:not([disabled]), .icon-btn:active { transform: scale(.97); }

/* Hover motion only for real pointers (touch fires false hovers on tap) */
.quick a:hover, .ex:hover, .pager a:hover, .flow-step:hover, .mode:hover { transform: none; }
.tlink, .tlink:hover { padding-left: 0; }
.tlink > div { transition: transform 200ms var(--ease); }
@media (hover: hover) and (pointer: fine) {
  .quick a:hover, .pager a:hover, .mode:hover { transform: translateY(-2px); }
  .ex:hover { transform: none; }
  .tlink:hover > div { transform: translateX(4px); }
}
.quick a, .pager a { transition: transform 200ms var(--ease), border-color 200ms ease, box-shadow 200ms ease; }
.ex { transition: border-color 200ms ease, box-shadow 200ms ease; }

/* Sliding indicators */
.nav-pill, .tab-pill { transition: transform 250ms var(--ease-in-out), width 250ms var(--ease-in-out), opacity 150ms ease; }
.toc { position: sticky; }
.toc a { border-left-color: transparent !important; transition: color 150ms ease; }
.toc-ind { position: absolute; left: -1px; top: 0; width: 2px; height: 1px; background: var(--lav); border-radius: 1px; transform-origin: top; transition: transform 250ms var(--ease-in-out); }

/* Quiz progress fills from where it was */
.progress i { width: 100% !important; transform-origin: left; transition: transform 300ms var(--ease); }

@media (max-width: 520px) { .quiz-card { padding: 22px 18px; } .prompt { font-size: 1.2rem; } }
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; }

/* Header gains its edge once you scroll */
.top { border-bottom-color: transparent; transition: border-color 200ms ease, background-color 200ms ease; }
.top.scrolled { border-bottom-color: var(--line); }

/* Keyboard-triggered focus should be instant */
.search input { transition: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-property: color, background-color, border-color, opacity, box-shadow !important; }
  .enter h1, .enter .lede, .enter .hero-search, .enter .counts, .enter .crumbs, .q-in, .answer, .feedback, .tabpanel.swap { animation: fade 200ms ease both !important; }
  main > section, .deb > div, .pager, .tl li, .steps li,
  .chart .bar, .chart .ln, .chart .area, .chart .pt, .chart .val, .sec-h h2::after, .hl-sweep, .opt.wrong, .list-in > * { animation: none !important; }
  .chart .ln { stroke-dasharray: none; }
}

/* ---------- Pastel accents (text and accents only; backgrounds stay white or black) ---------- */
::selection { background: var(--lav-soft); color: var(--ink); }
.eyebrow { color: var(--lav); }
.hl-sweep { background: linear-gradient(var(--butter-soft), var(--butter-soft)) no-repeat 0 88% / 100% 34%; border-radius: 2px; padding: 0 2px; }
@keyframes sweep { from { background-size: 0% 34%; } to { background-size: 100% 34%; } }
.counts div:nth-child(1) b { color: var(--p1); } .counts div:nth-child(2) b { color: var(--p3); }
.counts div:nth-child(3) b { color: var(--lav); } .counts div:nth-child(4) b { color: var(--p2); }
.nav-pill { background: var(--lav-soft); }

.hero-search input:focus, .search input:focus, .field:focus { border-color: var(--lav); box-shadow: 0 0 0 4px var(--lav-soft); }
.tag { border-color: transparent; background: var(--subtle); }
.tag.p1 { background: var(--p1-soft); color: var(--p1); } .tag.p2 { background: var(--p2-soft); color: var(--p2); } .tag.p3 { background: var(--p3-soft); color: var(--p3); }
.tag.plain { background: var(--subtle); color: var(--muted); }
.paper:nth-child(1) h2 { color: var(--ink); } .paper .sub { color: var(--lav); }
.tlink:hover b { color: var(--lav); } .tlink b { transition: color .2s; }
.toc a.on { color: var(--lav); border-left-color: var(--lav); }
.ov h3::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 10px; vertical-align: 2px; background: var(--chart-b); }
.ov > div:nth-child(4n+1) h3::before { background: var(--p1); } .ov > div:nth-child(4n+2) h3::before { background: var(--p3); }
.ov > div:nth-child(4n+3) h3::before { background: var(--lav); } .ov > div:nth-child(4n+4) h3::before { background: var(--peach); }
.ov li::before, .deb li::before, .box ul li::before { background: var(--lav); }
.deb-col.yes { background: linear-gradient(180deg, var(--p1-soft), transparent 70%); }
.deb-col.no { background: linear-gradient(180deg, var(--p2-soft), transparent 70%); }
.deb-col.yes h4 { color: var(--p1); } .deb-col.no h4 { color: var(--p2); }
.letter { color: var(--lav); border-bottom-color: var(--lav-soft); }
.chip[aria-pressed="true"] { background: var(--lav-soft); color: var(--lav); border-color: transparent; }
.toggle input:checked { background: var(--lav); }
.chart .ln { stroke: var(--p3); } .chart .area { fill: var(--p3-soft); }
.chart .pt { stroke: var(--p3); } .chart .pt.hl { fill: var(--p3); }
.tl::before { background: var(--lav-soft); } .tl li::before { border-color: var(--lav); } .tl li:hover::before { background: var(--lav); } .tl-y { color: var(--lav); }
.flow-n { color: var(--lav) !important; }
.wording { border-left-color: var(--lav); }
.ao .box:nth-child(1) b.big { color: var(--p1); } .ao .box:nth-child(2) b.big { color: var(--p3); } .ao .box:nth-child(3) b.big { color: var(--lav); }
.tabs { background: var(--lav-soft); }
.tabs button[aria-selected="true"] { color: var(--lav); }
.progress i { background: linear-gradient(90deg, var(--p1), var(--p3), var(--lav)); }
.mode[aria-pressed="true"] { border-color: var(--lav); box-shadow: inset 0 0 0 1px var(--lav); background: var(--lav-soft); }
.mode[aria-pressed="true"] b { color: var(--lav); }
.opt:hover:not([disabled]) { border-color: var(--lav); } .opt:hover:not([disabled]) .ok { color: var(--lav); border-color: var(--lav); }

/* Diagrams, tables and charts. Each returns HTML. Colours come from CSS tokens. */
(function () {
  function table(head, rows, note) {
    const lab = i => (head[i] || '').replace(/<[^>]+>/g, '');
    return '<div class="tbl-wrap"><table class="tbl stack"><thead><tr>' + head.map(h => '<th scope="col">' + h + '</th>').join('') +
      '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((c, i) => i === 0 ? '<th scope="row">' + c + '</th>' : '<td data-label="' + lab(i) + '">' + c + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div>' + (note ? '<p class="dg-note">' + note + '</p>' : '');
  }

  /* Horizontal bar chart. series: [{label, values:[...]}], keys: legend names */
  function bars(rows, keys, opts) {
    opts = opts || {};
    const max = opts.max || Math.max(...rows.flatMap(r => r.v));
    const rowH = keys.length * 16 + 14, labelW = 96, w = 560, chartW = w - labelW - 50;
    const h = rows.length * rowH + 30;
    let s = '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" role="img" aria-label="' + (opts.aria || 'Bar chart') + '">';
    // grid
    const ticks = opts.ticks || [0, max / 4, max / 2, (3 * max) / 4, max];
    ticks.forEach(t => {
      const x = labelW + (t / max) * chartW;
      s += '<line x1="' + x + '" x2="' + x + '" y1="0" y2="' + (h - 22) + '" class="grid"/>';
      s += '<text x="' + x + '" y="' + (h - 6) + '" class="axis" text-anchor="middle">' + Math.round(t) + (opts.unit || '') + '</text>';
    });
    rows.forEach((r, i) => {
      const y0 = i * rowH + 6;
      s += '<text x="' + (labelW - 8) + '" y="' + (y0 + rowH / 2 - 2) + '" class="lbl" text-anchor="end">' + r.l + '</text>';
      r.v.forEach((v, k) => {
        const bw = Math.max(1, (v / max) * chartW), y = y0 + k * 16;
        s += '<rect x="' + labelW + '" y="' + y + '" width="' + bw + '" height="12" rx="2" class="bar s' + k + '"/>';
        s += '<text x="' + (labelW + bw + 5) + '" y="' + (y + 10) + '" class="val">' + v + (opts.unit || '') + '</text>';

    });

  function line(points, opts) {

    let s = '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" role="img" aria-label="' + opts.aria + '">';
    for (let v = min; v <= max; v += opts.step) {
      s += '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + ys(v) + '" y2="' + ys(v) + '" class="grid"/>';
      s += '<text x="' + (pl - 6) + '" y="' + (ys(v) + 4) + '" class="axis" text-anchor="end">' + v + '%</text>';

    const area = d + ' L' + xs(points.length - 1) + ' ' + ys(min) + ' L' + xs(0) + ' ' + ys(min) + ' Z';

      if (hl) s += '<text x="' + xs(i) + '" y="' + (ys(p[1]) - 9) + '" class="val" text-anchor="middle">' + p[1] + '%</text>';

  function buildQuestions() {

      const x = pool[Math.floor(Math.random() * pool.length)]; if (!x) return null;

    if (e.target.id === 'thide') { state.termHide = e.target.checked; renderTermList(); }
  });
  main.addEventListener('click', e => {
    const b = e.target.closest('button, a, .def');
    if (!b) return;
    if (b.classList.contains('def')) { toggleDef(b); return; }
    const d = b.dataset;
    if (d.jump) { e.preventDefault(); const el = document.getElementById('s-' + d.jump); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - stickyOffset() - 12, behavior: reduced ? 'auto' : 'smooth' }); return; }
    if (d.quizStart) { e.preventDefault(); quiz.topics = [d.quizStart]; quiz.mode = 'mixed'; quiz.n = 10; quiz.prevP = 0; quiz.run = newRun(buildQuestions()); last = ''; location.hash = 'quiz'; return; }
    if (d.termsTopic) { const t = byId[d.termsTopic]; state.termPaper = t.paper; state.termTopic = t.id; state.termQ = ''; }
    if (d.srcTopic) { const t = byId[d.srcTopic]; state.srcPaper = t.paper; state.srcTopic = t.id; state.srcQ = ''; }
    if (d.f) {
      const k = d.f; let v = d.v;
      if (k === 'termPaper' || k === 'srcPaper' || k === 'pqPaper') { v = +v; state[k] = v; const tk = { termPaper: 'termTopic', srcPaper: 'srcTopic', pqPaper: 'pqTopic' }[k]; if (state[tk] && (!v || byId[state[tk]].paper !== v)) state[tk] = ''; }
      else state[k] = v;
      const keepFocus = document.activeElement && document.activeElement.id;
      rerender();
      if (keepFocus === 'tq' || keepFocus === 'sq') { const f = document.getElementById(keepFocus); if (f) f.focus(); }
      return;
    }
    if (d.tab) { if (d.tab !== examTab) { examTab = d.tab; tabSwap = true; rerender(); tabSwap = false; } return; }
    if (d.mode) { quiz.mode = d.mode; rerender(); return; }
    if (d.qt !== undefined) { if (!d.qt) quiz.topics = []; else { quiz.openTopics = true; quiz.topics = quiz.topics.includes(d.qt) ? quiz.topics.filter(x => x !== d.qt) : quiz.topics.concat(d.qt); } rerender(); return; }
    if (d.qp) { quiz.topics = TOPICS.filter(t => t.paper === +d.qp).map(t => t.id); rerender(); return; }
    if (d.qn) { quiz.n = +d.qn; rerender(); return; }
    if (d.act === 'clear-terms') { Object.assign(state, { termPaper: 0, termTopic: '', termQ: '' }); rerender(); return; }
    if (d.act === 'clear-src') { Object.assign(state, { srcPaper: 0, srcTopic: '', srcQ: '' }); rerender(); return; }
    const R = quiz.run;
    switch (d.act) {
      case 'quick': quiz.mode = 'mixed'; quiz.topics = []; quiz.n = 10; /* falls through */
      case 'start': case 'again': quiz.prevP = 0; quiz.run = newRun(buildQuestions()); last = ''; route(); quiz.run.fresh = false; last = 'quiz'; focusQuiz(); break;
      case 'retry': { const qs = shuffle(R.missedQs).map(q => q.opts ? Object.assign({}, q, { opts: shuffle(q.opts) }) : q); quiz.prevP = 0; quiz.run = newRun(qs); last = ''; route(); quiz.run.fresh = false; last = 'quiz'; focusQuiz(); break; }
      case 'setup': quiz.run = null; rerender(); break;
      case 'end': if (R && R.armed) { clearTimeout(R.armTimer); quiz.run = null; rerender(); } else if (R) { R.armed = true; rerender(); focusEl('[data-act="end"]'); R.armTimer = setTimeout(() => { if (quiz.run === R && R.armed) { R.armed = false; if (location.hash === '#quiz') rerender(); } }, 3500); } break;
      default: quizAct(d.act, d.v);
    }
  });
  function newRun(qs) { return { qs, i: 0, score: 0, missed: [], missedQs: [], picked: null, revealed: false, fresh: true }; }
  function focusEl(sel) { const el = main.querySelector(sel); if (el) el.focus({ preventScroll: true }); }
  function focusQuiz() {
    const R = quiz.run; if (!R) return;
    if (R.i >= R.qs.length) return focusEl('.done-h');
    if (R.picked != null) return focusEl('[data-act="next"]');
    if (R.revealed) return focusEl('[data-act="self"]');
    focusEl('.prompt');
  }
  function quizAct(act, v) {
    const R = quiz.run; if (!R || R.i >= R.qs.length) return;
    const q = R.qs[R.i];
    if (act === 'pick' && q.opts && R.picked == null) {
      R.picked = +v; if (q.opts[R.picked] === q.x) R.score++; else { R.missed.push({ html: '<b>' + esc(q.x.term) + '</b>: ' + esc(q.x.def), t: q.t }); R.missedQs.push(q); }
      R.armed = false; rerender(); focusQuiz();
    } else if (act === 'next' && R.picked != null) { R.i++; R.picked = null; R.revealed = false; R.fresh = true; R.armed = false; rerender(); focusQuiz(); }
    else if (act === 'reveal' && q.r && !R.revealed) { R.revealed = true; rerender(); focusQuiz(); }
    else if (act === 'self' && q.r && R.revealed) {
      if (v === '1') R.score++; else { R.missed.push({ html: esc(q.r.q) + ' <b>' + esc(q.r.a) + '</b>', t: q.t }); R.missedQs.push(q); }
      R.i++; R.revealed = false; R.fresh = true; R.armed = false; rerender(); focusQuiz();
    }
  }
  document.addEventListener('keydown', e => {
    if (location.hash !== '#quiz' || !quiz.run || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    const R = quiz.run; if (R.i >= R.qs.length) return;
    const q = R.qs[R.i], k = e.key.toLowerCase(), n = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (q.opts && R.picked == null && n >= 0 && n < q.opts.length) { e.preventDefault(); quizAct('pick', n); }
    else if (e.key === 'Enter' && R.picked != null && document.activeElement.dataset.act !== 'next') { e.preventDefault(); quizAct('next'); }
    else if (q.r && !R.revealed && (e.key === 'Enter' || e.key === ' ') && !document.activeElement.closest('button')) { e.preventDefault(); quizAct('reveal'); }
    else if (q.r && R.revealed && (k === 'y' || k === 'n')) { e.preventDefault(); quizAct('self', k === 'y' ? '1' : '0'); }
  });
  function toggleDef(el) {
    if (!el.closest('.hidden-def')) return;
    const open = el.classList.toggle('shown');
    el.setAttribute('aria-expanded', open);
    if (open) el.removeAttribute('aria-label'); else el.setAttribute('aria-label', 'Show definition of ' + el.closest('.term').querySelector('dt').textContent);
  }
  main.addEventListener('keydown', e => {
    const tab = e.target.closest && e.target.closest('[role="tab"]');
    if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault(); const ids = EXAM.types.map(x => x.id), i = ids.indexOf(examTab), nx = ids[(i + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
      examTab = nx; tabSwap = true; rerender(); tabSwap = false; focusEl('#tab-' + nx); return;
    }
  });
  main.addEventListener('keydown', e => { if (e.target.classList && e.target.classList.contains('def') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleDef(e.target); } });

  function navigate() {
    if (!document.startViewTransition || reduced || document.visibilityState !== 'visible') { route(); return; }
    const vt = document.startViewTransition(() => route());
    const clean = () => document.querySelectorAll('[data-vtn]').forEach(el => { el.style.viewTransitionName = ''; delete el.dataset.vtn; });
    vt.finished.then(clean, clean); vt.ready.catch(() => {}); vt.updateCallbackDone.catch(() => {});
  }
  window.addEventListener('hashchange', navigate);
  const lightSeg = (i) => main.querySelectorAll('.seg, .para-row').forEach(el => el.classList.toggle('lit', i != null && el.dataset.seg === String(i)));
  main.addEventListener('pointerover', e => { const r = e.target.closest && e.target.closest('[data-seg]'); lightSeg(r ? r.dataset.seg : null); });
  main.addEventListener('focusin', e => { const r = e.target.closest && e.target.closest('.para-row'); if (r) lightSeg(r.dataset.seg); });
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#topic-"]'); if (!a || reduced || a.dataset.jump || a.getAttribute('href') === location.hash) return;
    const label = a.querySelector('b') || a; label.style.viewTransitionName = 'topic-title'; label.dataset.vtn = '1';
    const cur = document.querySelector('h1[style*="topic-title"]'); if (cur && !a.contains(cur)) cur.style.viewTransitionName = 'none';
  }, true);
  if (!location.hash) { const lv = store.get('lastView', ''); if (lv && lv !== 'search') history.replaceState(null, '', '#' + lv); }
  route();
})();

</script>
