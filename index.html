<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politics Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Key terms, topic overviews, sources and exam technique for Edexcel A Level Politics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a calm reading column with a sticky top bar; colours borrowed from the Commons (green) and Lords (red) benches, plus a blue for global politics. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --ink: #18211c; --muted: #5a6560; --line: #dfe4e0; --hover: #eef2ef;
  --accent: #1d6a48; --accent-soft: #e2efe7; --on-accent: #ffffff;
  --p1: #1d6a48; --p1-soft: #e2efe7; --p2: #9a2c31; --p2-soft: #f6e5e5; --p3: #2d5a8c; --p3-soft: #e4ecf6;
  --good: #1d6a48; --bad: #b3363b;
  --chart-a: #a9b6ae; --chart-b: #1d6a48;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --surface: #181d1a; --ink: #e5ebe7; --muted: #9ba7a0; --line: #2a322e; --hover: #202723;
  --accent: #6cc196; --accent-soft: #1d2f26; --on-accent: #0e1a14;
  --p1: #6cc196; --p1-soft: #1d2f26; --p2: #e48d91; --p2-soft: #35201f; --p3: #8fb6e6; --p3-soft: #1d2a3a;
  --good: #6cc196; --bad: #ec7f84; --chart-a: #4c5a52; --chart-b: #6cc196; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --ink: #e5ebe7; --muted: #9ba7a0; --line: #2a322e; --hover: #202723;
  --accent: #6cc196; --accent-soft: #1d2f26; --on-accent: #0e1a14;
  --p1: #6cc196; --p1-soft: #1d2f26; --p2: #e48d91; --p2-soft: #35201f; --p3: #8fb6e6; --p3-soft: #1d2a3a;
  --good: #6cc196; --bad: #ec7f84; --chart-a: #4c5a52; --chart-b: #6cc196; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--serif); text-wrap: balance; line-height: 1.2; margin: 0; font-weight: 600; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--ink); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.brand .mace { display: inline-flex; gap: 3px; }
.brand .mace i { width: 6px; height: 18px; border-radius: 2px; display: block; }
.mace i:nth-child(1) { background: var(--p1); } .mace i:nth-child(2) { background: var(--p2); } .mace i:nth-child(3) { background: var(--p3); }
nav.main { display: flex; gap: 2px; flex-wrap: wrap; }
nav.main a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; font-weight: 500; font-size: .95rem; }
nav.main a:hover { background: var(--hover); color: var(--ink); }
nav.main a.on { color: var(--ink); background: var(--accent-soft); }
.search { margin-left: auto; position: relative; flex: 1 1 220px; max-width: 320px; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
@media (max-width: 760px) { .top { position: static; } .top .wrap { gap: 10px; } .search { max-width: none; order: 3; flex-basis: 100%; } nav.main { order: 2; width: 100%; overflow-x: auto; flex-wrap: nowrap; } nav.main a { white-space: nowrap; } }

main { padding-block: 32px 80px; }
.eyebrow { font: 500 .75rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); font-size: 1.08rem; max-width: 65ch; margin: 10px 0 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
section + section { margin-top: 44px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }

/* Paper tags */
.tag { display: inline-flex; align-items: center; gap: 6px; font: 500 .72rem/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; text-decoration: none; white-space: nowrap; }
.tag.p1 { background: var(--p1-soft); color: var(--p1); } .tag.p2 { background: var(--p2-soft); color: var(--p2); } .tag.p3 { background: var(--p3-soft); color: var(--p3); }

/* Home */
.hero { padding-block: 8px 28px; }
.hero-search { margin-top: 22px; max-width: 560px; position: relative; }
.hero-search input { width: 100%; padding: 14px 16px 14px 44px; font-size: 1.05rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.hero-search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.counts { display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; color: var(--muted); font-size: .92rem; }
.counts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.papers { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.paper h2 { font-size: 1.2rem; margin: 8px 0 6px; }
.paper .sub { font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
.tlink { display: block; padding: 8px 10px; margin: 0 -10px; border-radius: 6px; text-decoration: none; color: var(--ink); }
.tlink:hover { background: var(--hover); }
.tlink b { font-weight: 600; display: block; }
.tlink span { color: var(--muted); font-size: .88rem; display: block; line-height: 1.4; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.quick a { display: block; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--surface); }
.quick a:hover { border-color: var(--accent); }
.quick b { display: block; font-family: var(--serif); font-size: 1.1rem; }
.quick span { color: var(--muted); font-size: .9rem; }

/* Topic page */
.topic-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: flex; flex-direction: column; gap: 2px; font-size: .9rem; }
.toc a { color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 5px; border-left: 2px solid transparent; }
.toc a:hover { color: var(--ink); background: var(--hover); }
.toc .toc-h { font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 6px; }
@media (max-width: 860px) { .topic-layout { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: .9rem; color: var(--muted); }
.crumbs a { color: var(--muted); }
.ov { display: grid; gap: 22px; }
.ov h3 { margin-bottom: 8px; }
.ov ul, .deb ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; max-width: 72ch; }
.ov li::marker { color: var(--accent); }
.ov b { font-weight: 600; }
.deb { display: grid; gap: 18px; }
.deb-q { font-family: var(--serif); font-weight: 600; font-size: 1.08rem; margin-bottom: 10px; }
.deb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .deb-cols { grid-template-columns: 1fr; } }
.deb-col { border-radius: 8px; padding: 12px 14px; min-width: 0; }
.deb-col.yes { background: var(--p1-soft); } .deb-col.no { background: var(--p2-soft); }
.deb-col h4 { margin: 0 0 6px; font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.deb-col.yes h4 { color: var(--p1); } .deb-col.no h4 { color: var(--p2); }
.deb-col li { font-size: .95rem; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { text-decoration: none; color: var(--ink); font-weight: 600; }
.pager small { display: block; color: var(--muted); font-weight: 400; }

/* Diagrams */
.dg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.dg + .dg { margin-top: 16px; }
.dg h3 { font-size: 1.02rem; margin-bottom: 12px; }
.dg-note { color: var(--muted); font-size: .88rem; margin: 10px 0 0; }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 520px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl thead th { font: 500 .72rem/1.3 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--ink); }
.tbl tbody th { font-weight: 600; white-space: nowrap; }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 340px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 11px var(--mono); }
.chart .lbl { fill: var(--ink); font: 600 12px var(--sans); }
.chart .val { fill: var(--muted); font: 11px var(--mono); }
.chart .bar.s0 { fill: var(--chart-a); } .chart .bar.s1 { fill: var(--chart-b); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.chart .area { fill: var(--accent-soft); }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .pt.hl { fill: var(--accent); }
.legend { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); margin-top: 6px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .sw.s0 { background: var(--chart-a); } .legend .sw.s1 { background: var(--chart-b); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.flow-step { flex: 1 1 120px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.flow-step b { font-size: .92rem; } .flow-step span { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.flow-n { font: 500 .7rem/1 var(--mono) !important; color: var(--accent) !important; }
.flow-arrow { align-self: center; color: var(--muted); }
.flow.cycle .flow-step:last-child::after { content: "↺ back to start"; font: 500 .7rem var(--mono); color: var(--p2); margin-top: 4px; }
.tl { list-style: none; margin: 0; padding: 0 0 0 4px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.tl li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding-left: 14px; position: relative; font-size: .93rem; }
.tl li::before { content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl-y { font: 500 .85rem var(--mono); color: var(--accent); }
.branches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
@media (max-width: 560px) { .branches { grid-template-columns: 1fr; } }
.branch { padding: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: var(--bg); }
.branch span { font-size: .85rem; color: var(--muted); }
.branch:nth-child(1) { border-radius: 8px 0 0 8px; } .branch:nth-child(3) { border-radius: 0 8px 8px 0; margin-left: 14px; }
.branch.fused { background: var(--p1-soft); border-color: var(--p1); margin-left: -1px; }
.branch.sep { background: var(--p3-soft); border-color: var(--p3); }
@media (max-width: 560px) { .branch:nth-child(n) { border-radius: 8px; margin: 0 0 8px; } }
.spectrum .spec-bar { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--p1), var(--p3), var(--p2)); }
.spec-labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; font-size: .85rem; font-weight: 600; }
.spec-labels span:nth-child(n+3) { text-align: right; } .spec-labels small { font-weight: 400; color: var(--muted); }
.org-top { text-align: center; font-weight: 700; padding: 10px; border: 1px solid var(--ink); border-radius: 8px; max-width: 360px; margin: 0 auto 14px; }
.org-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.org-row div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.org-row div:first-child { background: var(--p2-soft); border-color: var(--p2); }
.org-row span { font-size: .82rem; color: var(--muted); }
.polar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
.polar svg { width: 100%; max-width: 140px; height: auto; margin: 6px auto; display: block; }
.polar span { font-size: .82rem; color: var(--muted); }
.polar .pole { fill: var(--accent); } .polar .minor { fill: var(--chart-a); }

/* Terms */
.filters { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
.frow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; font-size: .85rem; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; max-width: 420px; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); cursor: pointer; }
.term-list { display: flex; flex-direction: column; }
.term { display: grid; grid-template-columns: minmax(150px, 240px) minmax(0, 1fr); gap: 6px 24px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.term dt { font-weight: 600; font-family: var(--serif); font-size: 1.05rem; }
.term dd { margin: 0; color: var(--ink); max-width: 68ch; }
.term .meta { margin-top: 6px; }
@media (max-width: 640px) { .term { grid-template-columns: 1fr; } }
.term.hidden-def dd .def { filter: blur(6px); cursor: pointer; user-select: none; transition: filter .15s; }
.term.hidden-def dd .def.shown { filter: none; }
.letter { font: 600 1.4rem var(--serif); color: var(--accent); padding: 22px 0 4px; border-bottom: 1px solid var(--ink); }
.empty { color: var(--muted); padding: 30px 0; }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px; padding: 0 1px; }

/* Examples */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ex h3 { font-size: 1.05rem; }
.ex p { margin: 0; font-size: .94rem; }
.ex .use { font-size: .86rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: auto; }
.ex .use b { color: var(--ink); font-weight: 600; }

/* Exam */
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.box ul, .box ol { margin: 8px 0 0; padding-left: 1.15em; display: flex; flex-direction: column; gap: 5px; }
.box .meta { color: var(--muted); font-size: .88rem; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.wording { font-family: var(--serif); font-style: italic; background: var(--bg); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 12px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
.para { display: flex; flex-direction: column; gap: 0; }
.para-row { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.para-row:last-child { border-bottom: 0; }
.para-row .k { font: 500 .75rem/1.6 var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.k.c0 { color: var(--p1); } .k.c1 { color: var(--p1); } .k.c2 { color: var(--p3); } .k.c3 { color: var(--p2); } .k.c4 { color: var(--p2); } .k.c5 { color: var(--accent); font-weight: 700; }
.model p { margin: 0; display: inline; }
.model .seg { border-radius: 3px; padding: 1px 2px; }
.seg.c0, .seg.c1 { background: var(--p1-soft); } .seg.c2 { background: var(--p3-soft); } .seg.c3, .seg.c4 { background: var(--p2-soft); } .seg.c5 { background: var(--accent-soft); font-weight: 600; }
.ao { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 720px) { .ao { grid-template-columns: 1fr; } }
.ao b { font: 600 1.4rem var(--serif); color: var(--accent); display: block; }
.qlist { display: flex; flex-direction: column; }
.qitem { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
.qitem .q { font-family: var(--serif); font-size: 1.02rem; flex: 1 1 380px; }
.qitem .qmeta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag.plain { background: var(--hover); color: var(--muted); }

/* Quiz */
.quiz-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; max-width: 720px; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; color: var(--muted); font-size: .9rem; flex-wrap: wrap; }
.progress { height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 22px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.prompt { font-family: var(--serif); font-size: 1.35rem; line-height: 1.4; margin-bottom: 20px; }
.prompt small { display: block; font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt.right { border-color: var(--good); background: var(--p1-soft); }
.opt.wrong { border-color: var(--bad); background: var(--p2-soft); }
.opt[disabled] { cursor: default; }
.answer { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.answer b { display: block; font-size: 1.1rem; }
.answer span { color: var(--muted); font-size: .92rem; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }

/* Diagrams, tables and charts. Each returns HTML. Colours come from CSS tokens. */
(function () {
  function table(head, rows, note) {
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') +
      '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((c, i) => (i === 0 ? '<th scope="row">' : '<td>') + c + (i === 0 ? '</th>' : '</td>')).join('') + '</tr>').join('') +
      '</tbody></table></div>' + (note ? '<p class="dg-note">' + note + '</p>' : '');
  }

  /* Horizontal bar chart. series: [{label, values:[...]}], keys: legend names */
  function bars(rows, keys, opts) {
    opts = opts || {};
    const max = opts.max || Math.max(...rows.flatMap(r => r.v));
    const rowH = keys.length * 16 + 14, labelW = 96, w = 560, chartW = w - labelW - 50;
    const h = rows.length * rowH + 30;
    let s = '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" role="img" aria-label="' + (opts.aria || 'Bar chart') + '">';
    // grid
    const ticks = opts.ticks || [0, max / 4, max / 2, (3 * max) / 4, max];
    ticks.forEach(t => {
      const x = labelW + (t / max) * chartW;
      s += '<line x1="' + x + '" x2="' + x + '" y1="0" y2="' + (h - 22) + '" class="grid"/>';
      s += '<text x="' + x + '" y="' + (h - 6) + '" class="axis" text-anchor="middle">' + Math.round(t) + (opts.unit || '') + '</text>';
    });
    rows.forEach((r, i) => {
      const y0 = i * rowH + 6;
      s += '<text x="' + (labelW - 8) + '" y="' + (y0 + rowH / 2 - 2) + '" class="lbl" text-anchor="end">' + r.l + '</text>';
      r.v.forEach((v, k) => {
        const bw = Math.max(1, (v / max) * chartW), y = y0 + k * 16;
        s += '<rect x="' + labelW + '" y="' + y + '" width="' + bw + '" height="12" rx="2" class="bar s' + k + '"/>';
        s += '<text x="' + (labelW + bw + 5) + '" y="' + (y + 10) + '" class="val">' + v + (opts.unit || '') + '</text>';
      });
    });
    s += '</svg></div>';
    s += '<div class="legend">' + keys.map((k, i) => '<span><i class="sw s' + i + '"></i>' + k + '</span>').join('') + '</div>';
    return s;
  }

  function line(points, opts) {
    const w = 560, h = 230, pl = 40, pr = 16, pt = 14, pb = 34;
    const min = opts.min, max = opts.max;
    const xs = (i) => pl + (i / (points.length - 1)) * (w - pl - pr);
    const ys = (v) => pt + (1 - (v - min) / (max - min)) * (h - pt - pb);
    let s = '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" role="img" aria-label="' + opts.aria + '">';
    for (let v = min; v <= max; v += opts.step) {
      s += '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + ys(v) + '" y2="' + ys(v) + '" class="grid"/>';
      s += '<text x="' + (pl - 6) + '" y="' + (ys(v) + 4) + '" class="axis" text-anchor="end">' + v + '%</text>';
    }
    const d = points.map((p, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p[1]).toFixed(1)).join(' ');
    const area = d + ' L' + xs(points.length - 1) + ' ' + ys(min) + ' L' + xs(0) + ' ' + ys(min) + ' Z';
    s += '<path d="' + area + '" class="area"/><path d="' + d + '" class="ln"/>';
    points.forEach((p, i) => {
      const hl = opts.highlight && opts.highlight.includes(p[0]);
      s += '<circle cx="' + xs(i) + '" cy="' + ys(p[1]) + '" r="' + (hl ? 4.5 : 3) + '" class="' + (hl ? 'pt hl' : 'pt') + '"/>';
      if (hl) s += '<text x="' + xs(i) + '" y="' + (ys(p[1]) - 9) + '" class="val" text-anchor="middle">' + p[1] + '%</text>';
      if (i % 2 === 0 || i === points.length - 1) s += '<text x="' + xs(i) + '" y="' + (h - 14) + '" class="axis" text-anchor="middle">' + p[0] + '</text>';
    });
    return s + '</svg></div>';
  }

  /* Flow of boxes: steps = [[title, sub]], arrows between */
  function flow(steps, cls) {
    return '<div class="flow ' + (cls || '') + '">' + steps.map((s, i) =>
      '<div class="flow-step"><span class="flow-n">' + (s[2] || '') + '</span><b>' + s[0] + '</b>' + (s[1] ? '<span>' + s[1] + '</span>' : '') + '</div>' +
      (i < steps.length - 1 ? '<div class="flow-arrow" aria-hidden="true">→</div>' : '')).join('') + '</div>';
  }

  function timeline(items) {
    return '<ol class="tl">' + items.map(it => '<li><span class="tl-y">' + it[0] + '</span><span class="tl-t">' + it[1] + '</span></li>').join('') + '</ol>';
  }

  const TYPES = {}; EXAM.types.forEach(x => { TYPES[x.id] = x; });

  const store = {
    get(k, d) { try { const v = localStorage.getItem('prh:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('prh:' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const strip = s => String(s).replace(/<[^>]+>/g, '');
  const norm = s => strip(s).toLowerCase();
  function hl(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return safe.replace(re, '<mark>$1</mark>');
  }
  const tag = t => '<a class="tag p' + t.paper + '" href="#topic-' + t.id + '">' + esc(t.title) + '</a>';
  const ptag = p => '<span class="tag p' + p + '">' + PAPERS[p].name + '</span>';
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

    };

      '<section><div class="papers">' + [1, 2, 3].map(col).join('') + '</div></section>' +
      '<section><div class="quick">' +
      '<a href="#terms"><b>Key terms A–Z</b><span>Every definition, filterable. Hide definitions to test yourself.</span></a>' +
      '<a href="#sources"><b>Source bank</b><span>Examples you can drop into essays, with what each one proves.</span></a>' +
      '<a href="#exam"><b>Exam technique</b><span>Structures, mark scheme rules and the June 2026 examiners’ report.</span></a>' +
      '<a href="#quiz"><b>Test yourself</b><span>Definition quizzes and “who / what / when” example recall.</span></a></div></section>';
  }

  /* ---------- Topic ---------- */
  function topic(id) {

    const qs = EXAM.questions.filter(q => q.topic === id);
    const toc = [['ov', 'Overview'], t.diagrams.length && ['dg', 'Diagrams and tables'], t.debates.length && ['deb', 'Key debates'], ['kt', 'Key terms'], ['ex', 'Examples'], qs.length && ['pq', 'Practice questions']].filter(Boolean);
    return '<div class="crumbs">' + ptag(t.paper) + '<span>' + esc(t.area) + '</span></div>' +

  function exCard(e, q, showTopic) {

  /* ---------- Shared filters ---------- */
  const state = { termPaper: 0, termTopic: '', termQ: '', termHide: false, termSort: 'az', srcPaper: 0, srcTopic: '', srcQ: '', pqTopic: '' };
  function topicChips(paper, active, key) {

  /* ---------- Terms ---------- */
  function terms() {
    return '<div class="eyebrow">Key terms</div><h1>Key terms A–Z</h1><p class="lede">' + TERMS.length + ' definitions across all three papers. Hide the definitions and click each one to reveal it.</p>' +
      '<div class="filters"><input class="field" id="tq" type="search" placeholder="Filter terms or definitions" value="' + esc(state.termQ) + '">' +
      paperChips(state.termPaper, 'termPaper') + topicChips(state.termPaper, state.termTopic, 'termTopic') +

      '<span style="width:12px"></span><button class="chip" data-f="termSort" data-v="az" aria-pressed="' + (state.termSort === 'az') + '">A–Z</button>' +
      '<button class="chip" data-f="termSort" data-v="topic" aria-pressed="' + (state.termSort === 'topic') + '">By topic</button></div></div>' +
      '<div id="tlist"></div>';
  }
  function renderTermList() {
    const el = document.getElementById('tlist'); if (!el) return;
    const q = state.termQ.trim().toLowerCase();
    let list = TERMS.filter(x => (!state.termPaper || x.t.paper === state.termPaper) && (!state.termTopic || x.t.id === state.termTopic) &&
      (!q || x.term.toLowerCase().includes(q) || x.def.toLowerCase().includes(q)));
    if (!list.length) { el.innerHTML = '<p class="empty">No terms match. Try a shorter word or clear the filters.</p>'; return; }
    const row = x => '<div class="term' + (state.termHide ? ' hidden-def' : '') + '"><dt>' + hl(x.term, q) + '</dt><dd><div class="def" tabindex="0">' + hl(x.def, q) + '</div><div class="meta">' + tag(x.t) + '</div></dd></div>';
    let html = '';
    if (state.termSort === 'az') {
      list = list.slice().sort((a, b) => a.term.localeCompare(b.term));
      let L = '';
      list.forEach(x => { const l = x.term[0].toUpperCase(); if (l !== L) { L = l; html += '<div class="letter">' + l + '</div>'; } html += row(x); });
    } else {
      TOPICS.forEach(t => { const g = list.filter(x => x.t === t); if (g.length) html += '<div class="letter">' + esc(t.title) + '</div>' + g.map(row).join(''); });
    }
    el.innerHTML = '<p class="dg-note" style="margin-bottom:6px">' + list.length + ' terms</p><dl class="term-list">' + html + '</dl>';
  }

  /* ---------- Sources ---------- */
  function sources() {
    return '<div class="eyebrow">Source bank</div><h1>Examples for your essays</h1><p class="lede">A few strong, well-known examples per topic, each with what it proves. Learn the date and one number for each.</p>' +
      '<div class="filters"><input class="field" id="sq" type="search" placeholder="Filter examples, e.g. Lords, veto, 2019" value="' + esc(state.srcQ) + '">' +
      paperChips(state.srcPaper, 'srcPaper') + topicChips(state.srcPaper, state.srcTopic, 'srcTopic') + '</div><div id="slist"></div>';
  }
  function renderSrcList() {
    const el = document.getElementById('slist'); if (!el) return;
    const q = state.srcQ.trim().toLowerCase();
    const list = EXAMPLES.filter(e => (!state.srcPaper || e.tp.paper === state.srcPaper) && (!state.srcTopic || e.tp.id === state.srcTopic) &&
      (!q || norm(e.t + ' ' + e.d + ' ' + e.use).includes(q)));
    el.innerHTML = list.length ? '<p class="dg-note" style="margin-bottom:10px">' + list.length + ' examples</p><div class="ex-grid">' + list.map(e => exCard(e, q, true)).join('') + '</div>' :
      '<p class="empty">No examples match. Clear the filters or try another word.</p>';
  }

  /* ---------- Exam ---------- */
  let examTab = 'source30';
  function exam() {
    const E = EXAM, R = E.report2026;
    const ty = TYPES[examTab];
    return '<div class="eyebrow">Exam technique</div><h1>How to write a top-band answer</h1><p class="lede">Structures for every question type, the mark scheme rules that cap your level, and what examiners said about June 2026.</p>' +
      '<section><div class="sec-h"><h2>The three papers</h2></div><div class="cards3">' + E.papers.map(p =>
        '<div class="box"><div class="eyebrow">' + p.n + ' · ' + p.time + ' · ' + p.marks + ' marks</div><h3 style="margin-top:8px">' + esc(p.t) + '</h3><ul>' + p.parts.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('') + '</div></section>' +
      '<section><div class="sec-h"><h2>Assessment objectives</h2></div><div class="ao">' + E.aos.map(a => '<div class="box"><b>' + a[0] + '</b><h3>' + a[1] + '</h3><p class="meta" style="margin:6px 0 0">' + a[2] + '</p></div>').join('') + '</div>' +
      '<p class="dg-note">30-mark answers split marks equally: 10 per AO. 24-mark answers: 8 per AO. Paper 3’s 12-mark questions are AO1 and AO2 only.</p></section>' +
      '<section><div class="sec-h"><h2>Question types</h2></div><div class="tabs" role="tablist">' + E.types.map(x =>
        '<button role="tab" data-tab="' + x.id + '" aria-selected="' + (x.id === examTab) + '">' + esc(x.name) + '</button>').join('') + '</div>' +
      '<div class="eyebrow">' + esc(ty.where) + ' · ' + esc(ty.marks) + ' · ' + esc(ty.time) + '</div><div class="wording">' + esc(ty.wording) + '</div>' +
      '<div class="two"><div class="box"><h3>Plan and structure</h3><ol>' + ty.plan.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol></div>' +
      '<div class="box"><h3>What gets marks</h3><ul>' + ty.tips.map(x => '<li>' + (x.startsWith('Mark scheme rule') ? '<b>' + esc(x.split(':')[0]) + ':</b>' + esc(x.slice(x.indexOf(':') + 1)) : esc(x)) + '</li>').join('') + '</ul></div></div></section>' +
      '<section><div class="sec-h"><h2>Level bands</h2></div><div class="two"><div class="box"><h3>30-mark questions</h3>' + bandTable(E.levels.l30) + '</div><div class="box"><h3>24-mark questions</h3>' + bandTable(E.levels.l24) + '</div></div>' +
      '<p class="dg-note">Descriptor words from the mark scheme for comparative analysis, top to bottom: ' + E.levels.words.join(', ') + '.</p></section>' +
      '<section><div class="sec-h"><h2>Building a paragraph</h2></div><div class="two"><div class="box"><h3>' + esc(E.paragraph.name) + '</h3><div class="para">' +
      E.paragraph.steps.map((s, i) => '<div class="para-row"><span class="k c' + i + '">' + s[0] + '</span><span>' + esc(s[1]) + '</span></div>').join('') + '</div></div>' +
      '<div class="box model"><h3>Model paragraph</h3><p class="meta" style="margin:4px 0 12px">' + esc(E.model.q) + '</p><div>' +
      E.model.p.map((s, i) => '<span class="seg c' + i + '" title="' + s[0] + '">' + esc(s[1]) + '</span> ').join('') + '</div>' +
      '<div class="legend" style="flex-wrap:wrap;margin-top:12px">' + E.model.p.map((s, i) => '<span><span class="k c' + i + '" style="font:500 .72rem var(--mono);text-transform:uppercase">' + s[0] + '</span></span>').join('') + '</div></div></div></section>' +
      '<section><div class="sec-h"><h2>Linking phrases</h2></div><div class="cards3">' + E.linking.map(g => '<div class="box"><h3>' + esc(g.h) + '</h3><ul>' + g.l.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('') + '</div></section>' +
      '<section><div class="sec-h"><h2>What the examiners said (June 2026)</h2></div><p class="dg-note" style="margin:-6px 0 14px">Paraphrased from the ' + esc(R.src) + '.</p>' +
      '<div class="box"><h3>Across the paper</h3><ul>' + R.general.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' +
      '<div class="qlist" style="margin-top:14px">' + R.perQuestion.map(x => '<div class="qitem" style="display:block"><div class="q" style="margin-bottom:4px">' + esc(x.q) + '</div><div class="meta" style="color:var(--muted);font-size:.93rem">' + esc(x.tip) + '</div></div>').join('') + '</div></section>' +
      '<section><div class="sec-h"><h2>Common mistakes</h2></div><div class="box"><ul>' + E.mistakes.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div></section>' +
      '<section><div class="sec-h"><h2>Question bank</h2></div><p class="dg-note" style="margin:-6px 0 12px">Red tags are real June 2026 questions. The rest are practice questions written in the same style.</p>' +
      '<div class="filters" style="margin-top:0">' + topicChips(0, state.pqTopic, 'pqTopic') + '</div><div class="qlist">' +
      EXAM.questions.filter(q => !state.pqTopic || q.topic === state.pqTopic).map(q => qRow(q)).join('') + '</div></section>';

  function bandTable(rows) {
    return '<div class="tbl-wrap"><table class="tbl" style="min-width:0"><tbody>' + rows.map(r => '<tr><th scope="row">' + r[0] + '</th><td style="font-family:var(--mono)">' + r[1] + '</td></tr>').join('') + '</tbody></table></div>';
  }

  /* ---------- Quiz ---------- */
  const quiz = { mode: 'defs', topics: [], n: 10, run: null };
  function quizView() {
    if (quiz.run) return quizRun();
    const best = store.get('best', {});
    return '<div class="eyebrow">Test yourself</div><h1>Quiz</h1><p class="lede">Pick a mode and topics. Wrong answers are listed at the end so you can revise them.</p>' +
      '<div class="setup" style="margin-top:24px"><div><h3>Mode</h3><div class="modes">' +
      [['defs', 'Definition → term', 'Read a definition, choose the key term.'], ['terms', 'Term → definition', 'Read a term, choose the right definition.'],
       ['recall', 'Example recall', 'Who, what, when: e.g. the biggest Commons defeat.'], ['mixed', 'Mixed', 'All three types together.']].map(m =>
        '<button class="mode" data-mode="' + m[0] + '" aria-pressed="' + (quiz.mode === m[0]) + '"><b>' + m[1] + '</b><span>' + m[2] + '</span></button>').join('') + '</div></div>' +
      '<div><h3>Topics</h3><div class="frow"><button class="chip" data-qt="" aria-pressed="' + (!quiz.topics.length) + '">All topics</button>' +
      [1, 2, 3].map(p => '<button class="chip" data-qp="' + p + '">' + PAPERS[p].name + ' only</button>').join('') + '</div><div class="frow" style="margin-top:8px">' +
      TOPICS.map(t => '<button class="chip" data-qt="' + t.id + '" aria-pressed="' + quiz.topics.includes(t.id) + '">' + esc(t.title) + '</button>').join('') + '</div></div>' +
      '<div><h3>Length</h3><div class="frow">' + [10, 20, 40].map(n => '<button class="chip" data-qn="' + n + '" aria-pressed="' + (quiz.n === n) + '">' + n + ' questions</button>').join('') + '</div></div>' +
      '<div><button class="btn" data-act="start">Start quiz</button>' + (best[quiz.mode] != null ? '<span class="dg-note" style="margin-left:12px">Best in this mode: ' + best[quiz.mode] + '%</span>' : '') + '</div></div>';
  }
  function buildQuestions() {
    const inT = id => !quiz.topics.length || quiz.topics.includes(id);
    const pool = TERMS.filter(x => inT(x.t.id));
    const recall = RECALL.filter(r => inT(r.t));
    const mk = (kind) => {
      if (kind === 'recall') { const r = recall[Math.floor(Math.random() * recall.length)]; return r && { kind, r }; }
      const x = pool[Math.floor(Math.random() * pool.length)]; if (!x) return null;
      const same = TERMS.filter(o => o !== x && o.t === x.t), other = TERMS.filter(o => o !== x && o.t !== x.t);
      const distract = shuffle(same).concat(shuffle(other)).filter((o, i, a) => a.findIndex(z => z.term === o.term) === i && o.term !== x.term).slice(0, 3);
      return { kind, x, opts: shuffle([x].concat(distract)) };
    };
    const out = [], used = new Set();
    let guard = 0;
    while (out.length < quiz.n && guard++ < 800) {
      let kind = quiz.mode === 'mixed' ? ['defs', 'terms', 'recall'][out.length % 3] : quiz.mode;
      if (kind === 'recall' && !recall.length) kind = 'defs';
      if (kind !== 'recall' && !pool.length) kind = 'recall';
      const q = mk(kind); if (!q) break;
      const key = q.r ? q.r.q : q.kind + q.x.term;
      if (used.has(key) && used.size < (pool.length * 2 + recall.length)) continue;
      used.add(key); out.push(q);
    }
    return out;
  }
  function quizRun() {
    const R = quiz.run;
    if (R.i >= R.qs.length) {
      const pct = Math.round((R.score / R.qs.length) * 100);
      const best = store.get('best', {}); if (best[quiz.mode] == null || pct > best[quiz.mode]) { best[quiz.mode] = pct; store.set('best', best); }
      return '<div class="quiz-card"><div class="eyebrow">Finished</div><div class="score">' + R.score + ' / ' + R.qs.length + '</div><p class="lede" style="margin-top:0">' +
        (pct >= 80 ? 'Strong. Try a harder mix or a new topic.' : pct >= 50 ? 'Getting there. Revise the ones below, then go again.' : 'Worth another read of the topic pages, then retry.') + '</p>' +
        (R.missed.length ? '<h3 style="margin-top:20px">To revise</h3><div class="missed">' + R.missed.map(m => '<div>' + m + '</div>').join('') + '</div>' : '') +
        '<div class="btns"><button class="btn" data-act="again">Go again</button><button class="btn ghost" data-act="setup">Change settings</button></div></div>';
    }
    const q = R.qs[R.i];
    let body = '';
    const top = '<div class="quiz-top"><span>Question ' + (R.i + 1) + ' of ' + R.qs.length + '</span><span>Score ' + R.score + '</span></div><div class="progress"><i style="width:' + (R.i / R.qs.length * 100) + '%"></i></div>';
    if (q.kind === 'recall') {
      body = '<div class="prompt"><small>' + esc(byId[q.r.t].title) + ' · example recall</small>' + esc(q.r.q) + '</div>' +
        (R.revealed ? '<div class="answer"><b>' + esc(q.r.a) + '</b><span>' + esc(q.r.x) + '</span></div><p class="dg-note">Did you get it?</p><div class="btns"><button class="btn good" data-act="self" data-v="1">Got it</button><button class="btn bad" data-act="self" data-v="0">Missed it</button></div>'
          : '<p class="dg-note">Say or write your answer, then check.</p><div class="btns"><button class="btn" data-act="reveal">Show answer</button></div>');
    } else {
      const isDef = q.kind === 'defs';
      body = '<div class="prompt"><small>' + esc(q.x.t.title) + ' · ' + (isDef ? 'which term matches?' : 'which definition matches?') + '</small>' + esc(isDef ? q.x.def : q.x.term) + '</div><div class="opts">' +
        q.opts.map((o, k) => {
          let cls = 'opt';
          if (R.picked != null) { if (o === q.x) cls += ' right'; else if (k === R.picked) cls += ' wrong'; }
          return '<button class="' + cls + '" data-act="pick" data-v="' + k + '"' + (R.picked != null ? ' disabled' : '') + '>' + esc(isDef ? o.term : o.def) + '</button>';
        }).join('') + '</div>' +
        (R.picked != null ? '<div class="feedback">' + (q.opts[R.picked] === q.x ? '<b style="color:var(--good)">Correct.</b>' : '<b style="color:var(--bad)">Not quite.</b> The answer is <b>' + esc(q.x.term) + '</b>.') + '</div><div class="btns"><button class="btn" data-act="next">Next question</button></div>' : '');
    }
    return '<div class="quiz-card">' + top + body + '</div><div class="btns"><button class="btn ghost" data-act="setup">End quiz</button></div>';
  }

  /* ---------- Search ---------- */
  let gq = '';
  function search() {
    const q = gq.trim().toLowerCase();
    if (q.length < 2) return '<h1>Search</h1><p class="lede">Type at least two letters in the search box.</p>';
    const tr = TERMS.filter(x => x.term.toLowerCase().includes(q) || x.def.toLowerCase().includes(q))
      .sort((a, b) => (b.term.toLowerCase().includes(q) - a.term.toLowerCase().includes(q)));
    const ex = EXAMPLES.filter(e => norm(e.t + ' ' + e.d + ' ' + e.use).includes(q));
    const tp = TOPICS.filter(t => norm(t.title + ' ' + t.summary).includes(q));
    const rc = RECALL.filter(r => norm(r.q + ' ' + r.a + ' ' + r.x).includes(q));
    const ov = [];
    TOPICS.forEach(t => t.overview.forEach(o => o.p.forEach(p => { if (norm(p).includes(q)) ov.push({ t, h: o.h, p: strip(p) }); })));
    const total = tr.length + ex.length + tp.length + ov.length + rc.length;
    return '<div class="eyebrow">Search</div><h1>“' + esc(gq.trim()) + '”</h1><p class="lede">' + total + ' results</p>' +
      (tp.length ? '<section><div class="sec-h"><h2>Topics</h2></div><div class="quick">' + tp.map(t => '<a href="#topic-' + t.id + '"><b>' + esc(t.title) + '</b><span>' + hl(t.summary, q) + '</span></a>').join('') + '</div></section>' : '') +
      (tr.length ? '<section><div class="sec-h"><h2>Key terms</h2></div><dl class="term-list">' + tr.slice(0, 40).map(x => '<div class="term"><dt>' + hl(x.term, q) + '</dt><dd>' + hl(x.def, q) + '<div class="meta">' + tag(x.t) + '</div></dd></div>').join('') + '</dl></section>' : '') +
      (ex.length ? '<section><div class="sec-h"><h2>Examples</h2></div><div class="ex-grid">' + ex.slice(0, 30).map(e => exCard(e, q, true)).join('') + '</div></section>' : '') +
      (rc.length ? '<section><div class="sec-h"><h2>Quick facts</h2></div><dl class="term-list">' + rc.map(r => '<div class="term"><dt>' + hl(r.a, q) + '</dt><dd>' + hl(r.q, q) + '<div class="meta">' + tag(byId[r.t]) + '</div></dd></div>').join('') + '</dl></section>' : '') +
      (ov.length ? '<section><div class="sec-h"><h2>In topic overviews</h2></div><dl class="term-list">' + ov.slice(0, 30).map(o => '<div class="term"><dt>' + esc(o.t.title) + '<div class="dg-note" style="margin:2px 0 0;font-family:var(--sans)">' + esc(o.h) + '</div></dt><dd>' + hl(o.p, q) + '<div class="meta"><a href="#topic-' + o.t.id + '">Open topic</a></div></dd></div>').join('') + '</dl></section>' : '') +
      (!total ? '<p class="empty">Nothing found. Try a different spelling or a shorter word.</p>' : '');
  }
  function notFound() { return '<h1>Page not found</h1><p class="lede"><a href="#home">Back to topics</a></p>'; }

  /* ---------- Router ---------- */
  let last = '';
  function route() {
    const h = (location.hash || '#home').slice(1);
    let html, nav = h;
    if (h === 'home' || h === '') { html = home(); nav = 'home'; }
    else if (h.startsWith('topic-')) { html = topic(h.slice(6)); nav = 'home'; }
    else if (h === 'terms') html = terms();
    else if (h === 'sources') html = sources();
    else if (h === 'exam') html = exam();
    else if (h === 'quiz') html = quizView();
    else if (h === 'search') html = search();
    else html = notFound();
    main.innerHTML = html;
    document.querySelectorAll('nav.main a').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
    renderTermList(); renderSrcList();
    if (h !== last) { window.scrollTo(0, 0); last = h; }
    const t = h.startsWith('topic-') && byId[h.slice(6)];
    document.title = t ? t.title + ' · Politics Revision Hub' : 'Politics Revision Hub';
    store.set('lastView', h);
  }
  function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }

  /* ---------- Events ---------- */
  let st;
  function doSearch(v) {
    gq = v;
    clearTimeout(st);
    st = setTimeout(() => {
      if (gq.trim().length >= 2) {
        if (location.hash !== '#search') location.hash = 'search'; else rerender();
      }
    }, 180);
  }
  gsearch.addEventListener('input', e => doSearch(e.target.value));
  gsearch.addEventListener('keydown', e => { if (e.key === 'Enter') { gq = gsearch.value; location.hash === '#search' ? rerender() : (location.hash = 'search'); } });

  main.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'hsearch') { gsearch.value = e.target.value; doSearch(e.target.value); if (e.target.value.trim().length >= 2) setTimeout(() => gsearch.focus(), 200); }
    if (id === 'tq') { state.termQ = e.target.value; renderTermList(); }
    if (id === 'sq') { state.srcQ = e.target.value; renderSrcList(); }
  });
  main.addEventListener('change', e => {
    if (e.target.id === 'thide') { state.termHide = e.target.checked; renderTermList(); }
  });
  main.addEventListener('click', e => {
    const b = e.target.closest('button, a, .def');
    if (!b) return;
    if (b.classList.contains('def')) { b.classList.toggle('shown'); return; }
    const d = b.dataset;
    if (d.jump) { e.preventDefault(); const el = document.getElementById('s-' + d.jump); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }); return; }
    if (d.termsTopic) { const t = byId[d.termsTopic]; state.termPaper = t.paper; state.termTopic = t.id; state.termQ = ''; }
    if (d.srcTopic) { const t = byId[d.srcTopic]; state.srcPaper = t.paper; state.srcTopic = t.id; state.srcQ = ''; }
    if (d.quizTopic) { quiz.topics = [d.quizTopic]; quiz.run = null; }
    if (d.f) {
      const k = d.f; let v = d.v;
      if (k === 'termPaper' || k === 'srcPaper') { v = +v; state[k] = v; const tk = k === 'termPaper' ? 'termTopic' : 'srcTopic'; if (state[tk] && v && byId[state[tk]].paper !== v) state[tk] = ''; }
      else state[k] = v;
      const keepFocus = document.activeElement && document.activeElement.id;
      rerender();
      if (keepFocus === 'tq' || keepFocus === 'sq') { const f = document.getElementById(keepFocus); if (f) f.focus(); }
      return;
    }
    if (d.tab) { examTab = d.tab; rerender(); return; }
    if (d.mode) { quiz.mode = d.mode; rerender(); return; }
    if (d.qt !== undefined) { if (!d.qt) quiz.topics = []; else quiz.topics = quiz.topics.includes(d.qt) ? quiz.topics.filter(x => x !== d.qt) : quiz.topics.concat(d.qt); rerender(); return; }
    if (d.qp) { quiz.topics = TOPICS.filter(t => t.paper === +d.qp).map(t => t.id); rerender(); return; }
    if (d.qn) { quiz.n = +d.qn; rerender(); return; }
    const R = quiz.run;
    switch (d.act) {
      case 'start': case 'again': quiz.run = { qs: buildQuestions(), i: 0, score: 0, missed: [], picked: null, revealed: false }; rerender(); window.scrollTo(0, 0); break;
      case 'setup': quiz.run = null; rerender(); break;
      case 'pick': {
        const q = R.qs[R.i]; R.picked = +d.v;
        if (q.opts[R.picked] === q.x) R.score++; else R.missed.push('<b>' + esc(q.x.term) + '</b>: ' + esc(q.x.def));
        rerender(); break;
      }
      case 'next': R.i++; R.picked = null; R.revealed = false; rerender(); break;
      case 'reveal': R.revealed = true; rerender(); break;
      case 'self': {
        const q = R.qs[R.i]; if (d.v === '1') R.score++; else R.missed.push(esc(q.r.q) + ' <b>' + esc(q.r.a) + '</b>');
        R.i++; R.revealed = false; rerender(); break;
      }
    }
  });
  main.addEventListener('keydown', e => { if (e.target.classList && e.target.classList.contains('def') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.classList.toggle('shown'); } });

  window.addEventListener('hashchange', route);
  if (!location.hash) { const lv = store.get('lastView', ''); if (lv && lv !== 'search') history.replaceState(null, '', '#' + lv); }
  route();
})();

</script>
</html>
